<svg viewBox="0 0 720 220" width="720" height="220" role="img" aria-label="Diagram: budget split for a roughly 440 dollar first DJ rig" xmlns="http://www.w3.org/2000/svg"><text x="0" y="18" fill="#9a968d" font-size="12" letter-spacing="1.6" font-family="Inter, system-ui, sans-serif">HOW A ~$440 FIRST RIG ACTUALLY DIVIDES</text><rect x="0.0" y="40" width="444.4" height="34" rx="4" fill="#8b5cf6" opacity=".85"/><text x="223.2" y="62" text-anchor="middle" fill="#0b0b10" font-size="11" font-weight="700" font-family="Inter, system-ui, sans-serif">62%</text><rect x="446.4" y="40" width="142.0" height="34" rx="4" fill="#a78bfa" opacity=".85"/><text x="518.4" y="62" text-anchor="middle" fill="#0b0b10" font-size="11" font-weight="700" font-family="Inter, system-ui, sans-serif">20%</text><rect x="590.4" y="40" width="98.8" height="34" rx="4" fill="#8cc4ff" opacity=".85"/><text x="640.8" y="62" text-anchor="middle" fill="#0b0b10" font-size="11" font-weight="700" font-family="Inter, system-ui, sans-serif">14%</text><rect x="691.2" y="40" width="26.8" height="34" rx="4" fill="#63d9a8" opacity=".85"/><rect x="0" y="94" width="9" height="9" rx="2" fill="#8b5cf6"/><text x="16" y="102" fill="#9a968d" font-size="11" font-family="Inter, system-ui, sans-serif">Controller</text><text x="150" y="102" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">$273</text><rect x="0" y="116" width="9" height="9" rx="2" fill="#a78bfa"/><text x="16" y="124" fill="#9a968d" font-size="11" font-family="Inter, system-ui, sans-serif">Monitor speaker</text><text x="150" y="124" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">$88</text><rect x="0" y="138" width="9" height="9" rx="2" fill="#8cc4ff"/><text x="16" y="146" fill="#9a968d" font-size="11" font-family="Inter, system-ui, sans-serif">Headphones</text><text x="150" y="146" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">$62</text><rect x="0" y="160" width="9" height="9" rx="2" fill="#63d9a8"/><text x="16" y="168" fill="#9a968d" font-size="11" font-family="Inter, system-ui, sans-serif">Cables + adapters</text><text x="150" y="168" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">$18</text><text x="420" y="102" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">The controller is most of the budget, but not all of it.</text><text x="420" y="121" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">The monitor is the optional line — drop it</text><text x="420" y="140" fill="#7c7970" font-size="11" font-family="Inter, system-ui, sans-serif">first if the total creeps over budget.</text><text x="420" y="172" fill="#63d9a8" font-size="11" font-family="Inter, system-ui, sans-serif">Headphones alone are enough to learn on.</text></svg>