<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="100%" height="100%">
  <!-- Offbeat technical illustration, not a product photograph.
       ROKIT 5 G4 is one powered cabinet with a single balanced combo input.
       The CD case that covered the rear LCD in early retail batches is a
       marketing gimmick, not a product feature, so it is not drawn. -->
  <title>KRK ROKIT 5 G4, single powered cabinet</title>

  <rect x="108" y="48" width="184" height="268" rx="12" fill="#12111c" stroke="rgba(250,204,21,0.3)" stroke-width="2"/>

  <!-- 1-inch Kevlar dome tweeter -->
  <circle cx="200" cy="108" r="23" fill="#0b0b10" stroke="#33333f" stroke-width="2"/>
  <circle cx="200" cy="108" r="13" fill="#2b2b36" stroke="#4b4b5a" stroke-width="1.5"/>
  <circle cx="200" cy="108" r="4" fill="#0b0b10"/>

  <!-- 5.25-inch yellow Kevlar woofer -->
  <circle cx="200" cy="208" r="52" fill="#facc15" stroke="#a16207" stroke-width="3"/>
  <circle cx="200" cy="208" r="40" fill="none" stroke="rgba(161,98,7,0.45)" stroke-width="2"/>
  <circle cx="200" cy="208" r="28" fill="none" stroke="rgba(161,98,7,0.35)" stroke-width="1.5"/>
  <circle cx="200" cy="208" r="16" fill="#1c1917"/>
  <circle cx="200" cy="208" r="5" fill="#facc15"/>

  <!-- Front-firing bass-port slot -->
  <rect x="160" y="268" width="80" height="10" rx="4" fill="#07070b" stroke="#33333f" stroke-width="1.5"/>

  <!-- One balanced combo input: XLR pins inside a 1/4-inch jack bore -->
  <rect x="163" y="288" width="74" height="18" rx="5" fill="#0b0b10" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <circle cx="182" cy="297" r="6" fill="#101018" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="200" cy="297" r="3" fill="#38bdf8"/>
  <circle cx="218" cy="297" r="6" fill="#101018" stroke="#8b5cf6" stroke-width="1.5"/>

  <text x="200" y="32" fill="#fff" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">KRK ROKIT 5 G4 (Single Cabinet)</text>
  <text x="200" y="338" fill="#facc15" font-size="10" font-family="sans-serif" text-anchor="middle">One Combo XLR / 1/4&#8243; In &#183; LCD DSP &#183; No RCA</text>
</svg>
