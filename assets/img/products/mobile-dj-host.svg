  <circle cx="96" cy="164" r="3" fill="#777387"/>
  <rect x="157" y="43" width="115" height="104" rx="13" fill="#1c1d27" stroke="#52627f" stroke-width="2"/>
  <rect x="165" y="51" width="99" height="88" rx="7" fill="url(#screen)"/>
  <path d="M176 78h12v-10h12v22h12V65h12v28h12V72h12v18h12" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="215" cy="158" r="6" fill="#30313d" stroke="#777387"/>
  <text x="160" y="190" fill="#9ea4b4" font-family="system-ui,sans-serif" font-size="9" letter-spacing="2" text-anchor="middle">ILLUSTRATIVE APP HOST</text>
