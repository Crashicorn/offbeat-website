<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <rect x="15" y="15" width="370" height="450" rx="12" fill="#14141e" stroke="#8b5cf6" stroke-width="2"/>
  <!-- Top Send FX & Display Section -->
