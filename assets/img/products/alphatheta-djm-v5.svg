    <circle cx="95" cy="145" r="8"/><circle cx="95" cy="170" r="8"/><circle cx="95" cy="195" r="8"/><circle cx="95" cy="220" r="8"/>
    <!-- Channel 2 -->
    <circle cx="195" cy="145" r="8"/><circle cx="195" cy="170" r="8"/><circle cx="195" cy="195" r="8"/><circle cx="195" cy="220" r="8"/>
    <!-- Channel 3 -->
    <circle cx="295" cy="145" r="8"/><circle cx="295" cy="170" r="8"/><circle cx="295" cy="195" r="8"/><circle cx="295" cy="220" r="8"/>
  </g>
  <!-- Filter Knobs -->
  <circle cx="95" cy="255" r="11" fill="#1e1e2c" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="195" cy="255" r="11" fill="#1e1e2c" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="295" cy="255" r="11" fill="#1e1e2c" stroke="#8b5cf6" stroke-width="1.5"/>
  <!-- 60mm Long-Throw Channel Faders -->
  <line x1="95" y1="290" x2="95" y2="370" stroke="#2a2a3c" stroke-width="4"/>
  <rect x="85" y="320" width="20" height="12" rx="2" fill="#ddd"/>
  <line x1="195" y1="290" x2="195" y2="370" stroke="#2a2a3c" stroke-width="4"/>
  <rect x="185" y="320" width="20" height="12" rx="2" fill="#ddd"/>
  <line x1="295" y1="290" x2="295" y2="370" stroke="#2a2a3c" stroke-width="4"/>
  <rect x="285" y="320" width="20" height="12" rx="2" fill="#ddd"/>
