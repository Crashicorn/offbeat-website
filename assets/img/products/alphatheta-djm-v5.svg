  <line x1="120" y1="410" x2="270" y2="410" stroke="#2a2a3c" stroke-width="4"/>
  <rect x="185" y="403" width="16" height="14" rx="2" fill="#fff"/>
  <text x="200" y="445" fill="#fff" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">ALPHATHETA DJM-V5 ($2,199)</text>
