  <circle cx="65" cy="60" r="10" fill="#2d2d42" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="110" cy="60" r="10" fill="#2d2d42" stroke="#8b5cf6" stroke-width="1.5"/>
  <circle cx="155" cy="60" r="10" fill="#2d2d42" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="195" y="42" width="160" height="36" rx="4" fill="#080810" stroke="#38bdf8" stroke-width="1"/>
  <text x="275" y="64" fill="#38bdf8" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">SONICLINK 2.4GHz</text>
  <text x="275" y="105" fill="#a78bfa" font-size="8" font-family="sans-serif" text-anchor="middle">6 SEND FX · CROSS-PASS FILTER</text>
  <!-- 3 Channels Section with 4-Band EQ -->
  <g fill="#444">
