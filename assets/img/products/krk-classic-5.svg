<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="100%" height="100%">
  <!-- Offbeat technical illustration, not a product photograph.
       KRK Classic 5 is a two-cabinet pack: each cabinet is powered and each
       carries its own XLR, 1/4-inch TRS and RCA input. Yellow woven-aramid
       cone identifies the Classic line; the ROKIT G4 is a different cabinet. -->
  <title>KRK Classic 5 monitor pack, two powered cabinets</title>

  <!-- Left cabinet -->
  <g>
    <rect x="42" y="52" width="148" height="262" rx="12" fill="#12111c" stroke="rgba(250,204,21,0.3)" stroke-width="2"/>
    <!-- 1-inch textile soft-dome tweeter -->
    <circle cx="116" cy="112" r="21" fill="#0b0b10" stroke="#33333f" stroke-width="2"/>
    <circle cx="116" cy="112" r="12" fill="#2b2b36" stroke="#4b4b5a" stroke-width="1.5"/>
    <circle cx="116" cy="112" r="4" fill="#0b0b10"/>
    <!-- 5-inch yellow woven-aramid woofer -->
    <circle cx="116" cy="212" r="47" fill="#facc15" stroke="#a16207" stroke-width="3"/>
    <circle cx="116" cy="212" r="36" fill="none" stroke="rgba(161,98,7,0.45)" stroke-width="2"/>
    <circle cx="116" cy="212" r="25" fill="none" stroke="rgba(161,98,7,0.35)" stroke-width="1.5"/>
    <circle cx="116" cy="212" r="15" fill="#1c1917"/>
    <circle cx="116" cy="212" r="5" fill="#facc15"/>
    <!-- Front bass-port slot -->
    <rect x="76" y="268" width="80" height="10" rx="4" fill="#07070b" stroke="#33333f" stroke-width="1.5"/>
    <!-- Rear-panel inputs mirrored on the drawing plate: XLR, TRS, RCA -->
    <rect x="76" y="288" width="80" height="16" rx="4" fill="#0b0b10" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="96" cy="296" r="5" fill="#101018" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="116" cy="296" r="4" fill="#101018" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="136" cy="296" r="3" fill="#101018" stroke="#facc15" stroke-width="1.5"/>
  </g>

  <!-- Right cabinet -->
  <g>
    <rect x="210" y="52" width="148" height="262" rx="12" fill="#12111c" stroke="rgba(250,204,21,0.3)" stroke-width="2"/>
    <circle cx="284" cy="112" r="21" fill="#0b0b10" stroke="#33333f" stroke-width="2"/>
    <circle cx="284" cy="112" r="12" fill="#2b2b36" stroke="#4b4b5a" stroke-width="1.5"/>
    <circle cx="284" cy="112" r="4" fill="#0b0b10"/>
    <circle cx="284" cy="212" r="47" fill="#facc15" stroke="#a16207" stroke-width="3"/>
    <circle cx="284" cy="212" r="36" fill="none" stroke="rgba(161,98,7,0.45)" stroke-width="2"/>
    <circle cx="284" cy="212" r="25" fill="none" stroke="rgba(161,98,7,0.35)" stroke-width="1.5"/>
    <circle cx="284" cy="212" r="15" fill="#1c1917"/>
    <circle cx="284" cy="212" r="5" fill="#facc15"/>
    <rect x="244" y="268" width="80" height="10" rx="4" fill="#07070b" stroke="#33333f" stroke-width="1.5"/>
    <rect x="244" y="288" width="80" height="16" rx="4" fill="#0b0b10" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="264" cy="296" r="5" fill="#101018" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="284" cy="296" r="4" fill="#101018" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="304" cy="296" r="3" fill="#101018" stroke="#facc15" stroke-width="1.5"/>
  </g>

  <text x="200" y="34" fill="#fff" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">KRK Classic 5 (Pair, Monitor Pack)</text>
  <text x="200" y="340" fill="#facc15" font-size="10" font-family="sans-serif" text-anchor="middle">Two Powered Cabinets &#183; XLR / TRS / RCA In &#183; 50 W Bi-Amp</text>
</svg>
